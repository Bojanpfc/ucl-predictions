<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prediction League</title>
  <style>
    :root {
      --bg-color: #0b0e14;
      --card-bg: #151a21;
      --accent-color: #00f0ff;
      --text-main: #ffffff;
      --text-dim: #9aa5b1;
      --border-color: #202936;
      --input-bg: #0b0e14;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      padding: 20px 10px;
      min-height: 100vh;
    }

    .main-container {
      width: 100%;
      max-width: 500px;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    /* Tabs Styling */
    .tabs-header {
      display: flex;
      background-color: var(--bg-color);
      padding: 4px;
      border-radius: 10px;
      margin-bottom: 20px;
      border: 1px solid var(--border-color);
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      background: transparent;
      border: none;
      color: var(--text-dim);
      font-weight: 600;
      font-size: 14px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background-color: var(--accent-color);
      color: #000000;
      box-shadow: 0 2px 8px rgba(0, 240, 255, 0.3);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* Original Form Styling */
    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--accent-color);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    input[type="text"], select {
      width: 100%;
      padding: 12px;
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-main);
      font-size: 14px;
      outline: none;
    }

    input[type="text"]:focus, select:focus {
      border-color: var(--accent-color);
    }

    .match-card {
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
    }

    .match-title {
      font-size: 13px;
      font-weight: 600;
      text-align: center;
      margin-bottom: 8px;
      color: var(--text-main);
    }

    .match-inputs {
      display: flex;
      gap: 8px;
    }

    .match-inputs select {
      flex: 1;
    }

    .match-inputs input {
      flex: 1;
      text-align: center;
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      background-color: var(--accent-color);
      color: #000;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      margin-top: 10px;
    }

    /* Leaderboard Table Styling */
    .table-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: center;
    }

    th {
      font-size: 11px;
      text-transform: uppercase;
      color: var(--accent-color);
      padding: 10px 5px;
      border-bottom: 1px solid var(--border-color);
    }

    td {
      padding: 10px 5px;
      font-size: 13px;
      border-bottom: 1px solid var(--border-color);
    }

    .player-col {
      text-align: left;
      font-weight: 600;
    }

    .pts-col {
      color: var(--accent-color);
      font-weight: 700;
    }

    .status-msg {
      text-align: center;
      padding: 15px;
      font-size: 13px;
      color: var(--text-dim);
    }

    .alert {
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 10px;
      font-size: 13px;
      text-align: center;
      display: none;
    }

    .alert.success { background: rgba(0, 240, 255, 0.1); color: var(--accent-color); border: 1px solid var(--accent-color); }
    .alert.error { background: rgba(255, 68, 68, 0.1); color: #ff4444; border: 1px solid #ff4444; }
  </style>
</head>
<body>

  <div class="main-container">
    <!-- Tabs -->
    <div class="tabs-header">
      <button class="tab-btn active" onclick="switchTab('predictions-tab', this)">Predictions</button>
      <button class="tab-btn" onclick="switchTab('leaderboard-tab', this)">Leaderboard</button>
    </div>

    <!-- TAB 1: PREDICTIONS -->
    <div id="predictions-tab" class="tab-content active">
      <div class="form-group">
        <label>Discord Username</label>
        <input type="text" id="player-name" placeholder="Enter username">
      </div>

      <div class="form-group">
        <label>Round</label>
        <select id="round-select">
          <option value="Round 1">Round 1</option>
        </select>
      </div>

      <div id="matches-list"></div>

      <div id="alert-box" class="alert"></div>
      <button class="submit-btn" onclick="submitData()">Submit Predictions</button>
    </div>

    <!-- TAB 2: LEADERBOARD -->
    <div id="leaderboard-tab" class="tab-content">
      <div id="status-text" class="status-msg">Loading ranking data...</div>

      <div class="table-wrapper">
        <table id="ranking-table" style="display: none;">
          <thead>
            <tr>
              <th>#</th>
              <th style="text-align: left;">Player</th>
              <th>PTS</th>
              <th>Exact</th>
              <th>Out.</th>
              <th>Pld</th>
            </tr>
          </thead>
          <tbody id="ranking-rows"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    // ZAMENI OVDE SA TVOJIM APPS SCRIPT WEB APP URL-OM:
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwqZ-YOUR_SCRIPT_ID_HERE/exec';

    const matchesList = [
      "AEK Athens vs LASK",
      "Club Brugge vs Aston Villa",
      "Borussia Dortmund vs Villarreal",
      "Porto vs Manchester City",
      "Lille vs Real Betis",
      "Real Madrid vs Inter",
      "Barcelona vs Feyenoord",
      "Stuttgart vs Viking",
      "Liverpool vs Atlético de Madrid",
      "Paris Saint-Germain vs Slovan Bratislava",
      "Sporting CP vs Galatasaray",
      "Napoli vs Arsenal",
      "Fenerbahçe vs Roma",
      "PSV Eindhoven vs Shakhtar Donetsk",
      "Como vs Leipzig",
      "Bayern München vs Bodø/Glimt",
      "Manchester United vs Sabah",
      "Slavia Praha vs Lens"
    ];

    // Render matches form
    function renderMatches() {
      const container = document.getElementById('matches-list');
      container.innerHTML = '';
      matchesList.forEach((match, i) => {
        container.innerHTML += `
          <div class="match-card">
            <div class="match-title">${match}</div>
            <div class="match-inputs">
              <select id="sign-${i}">
                <option value="1">1</option>
                <option value="X">X</option>
                <option value="2">2</option>
              </select>
              <input type="text" id="score-${i}" placeholder="Score (2:1)" maxlength="5">
            </div>
          </div>
        `;
      });
    }

    // Switch Tabs
    function switchTab(tabId, btn) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

      document.getElementById(tabId).classList.add('active');
      btn.classList.add('active');

      if (tabId === 'leaderboard-tab') {
        getLeaderboard();
      }
    }

    // Send predictions
    function submitData() {
      const player = document.getElementById('player-name').value.trim();
      const round = document.getElementById('round-select').value;
      const alertBox = document.getElementById('alert-box');

      if (!player) {
        showAlert('Please enter your Discord Username.', 'error');
        return;
      }

      const predictions = [];
      for (let i = 0; i < matchesList.length; i++) {
        const sign = document.getElementById(`sign-${i}`).value;
        let score = document.getElementById(`score-${i}`).value.trim();

        if (!score) {
          showAlert(`Please enter score for match ${i+1}.`, 'error');
          return;
        }

        predictions.push({
          match: matchesList[i],
          prediction: sign,
          score: score
        });
      }

      showAlert('Sending predictions...', 'success');

      fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ player, round, predictions })
      })
      .then(() => showAlert('Predictions submitted successfully!', 'success'))
      .catch(() => showAlert('Error submitting predictions.', 'error'));
    }

    // Fetch Leaderboard
    function getLeaderboard() {
      const statusText = document.getElementById('status-text');
      const table = document.getElementById('ranking-table');
      const tbody = document.getElementById('ranking-rows');

      statusText.style.display = 'block';
      statusText.innerText = 'Loading ranking data...';
      table.style.display = 'none';

      fetch(`${SCRIPT_URL}?action=ranking`)
        .then(res => res.json())
        .then(data => {
          if (data.success && data.ranking) {
            tbody.innerHTML = '';
            if(data.ranking.length === 0) {
              statusText.innerText = 'No scores recorded yet.';
              return;
            }

            data.ranking.forEach(r => {
              tbody.innerHTML += `
                <tr>
                  <td><strong>${r.rank}</strong></td>
                  <td class="player-col">${r.player}</td>
                  <td class="pts-col">${r.points}</td>
                  <td>${r.exactScores}</td>
                  <td>${r.correctOutcomes}</td>
                  <td>${r.matchesPlayed}</td>
                </tr>
              `;
            });
            statusText.style.display = 'none';
            table.style.display = 'table';
          }
        })
        .catch(() => {
          statusText.innerText = 'Failed to load leaderboard.';
        });
    }

    function showAlert(msg, type) {
      const alertBox = document.getElementById('alert-box');
      alertBox.innerText = msg;
      alertBox.className = `alert ${type}`;
      alertBox.style.display = 'block';
    }

    renderMatches();
  </script>
</body>
</html>
