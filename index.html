<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prognoze Lige</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0b1329;
      color: #ffffff;
      margin: 0;
      padding: 15px;
    }
    h2 { text-align: center; color: #00e5ff; }
    
    /* Tabela */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      background: #131b36;
      border-radius: 8px;
      overflow: hidden;
    }
    th, td {
      padding: 12px 10px;
      text-align: left;
      font-size: 14px;
      border-bottom: 1px solid #1f2c56;
    }
    th { background: #1a254c; color: #00e5ff; }
    
    /* Uklonjeno podvlačenje sa imena igrača */
    .player-link {
      color: #00e5ff;
      cursor: pointer;
      text-decoration: none !important;
      border-bottom: none !important;
    }
    .player-link:hover {
      text-decoration: underline !important;
    }

    /* Modal prozor */
    #modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.8);
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 10px;
      box-sizing: border-box;
    }
    .modal-content {
      background: #131b36;
      border: 2px solid #00e5ff;
      border-radius: 12px;
      width: 100%;
      max-width: 450px;
      max-height: 85vh;
      overflow-y: auto;
      padding: 20px;
      box-shadow: 0 5px 25px rgba(0, 229, 255, 0.3);
      position: relative;
    }
    .close-btn {
      position: absolute;
      top: 15px; right: 15px;
      background: #ff4757;
      color: white;
      border: none;
      border-radius: 50%;
      width: 30px; height: 30px;
      font-weight: bold;
      cursor: pointer;
    }
    
    /* Stilovi za status pogotka u modalu */
    .match-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid #1f2c56;
      font-size: 13px;
    }
    .badge {
      padding: 4px 8px;
      border-radius: 4px;
      font-weight: bold;
      font-size: 12px;
    }
    .bg-green { background: #2ed573; color: #000; }
    .bg-red { background: #ff4757; color: #fff; }
    .bg-gray { background: #57606f; color: #fff; }
  </style>
</head>
<body>

  <h2>Rang Lista Igrača</h2>
  <div id="loading">Učitavanje rang liste...</div>
  
  <table id="rankingTable" style="display:none;">
    <thead>
      <tr>
        <th>#</th>
        <th>Igrač</th>
        <th>Bodovi</th>
        <th>Tačni</th>
        <th>Ishodi</th>
      </tr>
    </thead>
    <tbody id="rankingBody"></tbody>
  </table>

  <!-- Modal za inspekciju -->
  <div id="modal">
    <div class="modal-content">
      <button class="close-btn" onclick="closeModal()">×</button>
      <h3 id="modalTitle" style="color: #00e5ff; margin-top: 0;">Tiket igrača</h3>
      <div id="modalBody">Učitavanje tiketa...</div>
    </div>
  </div>

  <script>
    // Zamenite sa URL-om vašeg Google Apps Script-a
    var SCRIPT_URL = "OVAJ_URL_ZAMENITE_VASIM_APPS_SCRIPT_WEB_URL-OM";

    function fetchRanking() {
      fetch(SCRIPT_URL + "?action=ranking")
        .then(response => response.json())
        .then(data => {
          document.getElementById("loading").style.display = "none";
          if (data.success) {
            var tbody = document.getElementById("rankingBody");
            tbody.innerHTML = "";
            data.ranking.forEach(row => {
              var tr = document.createElement("tr");
              tr.innerHTML = `
                <td>${row.rank}</td>
                <td><span class="player-link" onclick="inspectPlayer('${row.player}')">${row.player}</span></td>
                <td><b>${row.points}</b></td>
                <td>${row.exactScores}</td>
                <td>${row.correctOutcomes}</td>
              `;
              tbody.appendChild(tr);
            });
            document.getElementById("rankingTable").style.display = "table";
          }
        })
        .catch(err => {
          document.getElementById("loading").innerText = "Greška pri učitavanju.";
        });
    }

    function inspectPlayer(playerName) {
      document.getElementById("modal").style.display = "flex";
      document.getElementById("modalTitle").innerText = "Tiket: " + playerName;
      document.getElementById("modalBody").innerHTML = "Učitavanje prognoza...";

      fetch(SCRIPT_URL + "?action=player_predictions&player=" + encodeURIComponent(playerName))
        .then(response => response.json())
        .then(data => {
          if (data.success) {
            var html = `<p style="font-size: 13px; color: #a4b0be;">Runda: <b>${data.round}</b></p>`;
            if (data.predictions.length === 0) {
              html += "<p>Nema unetih prognoza za ovog igrača.</p>";
            } else {
              data.predictions.forEach(p => {
                var badgeClass = "bg-gray";
                if (p.status === "exact" || p.status === "outcome") {
                  badgeClass = "bg-green";
                } else if (p.status === "miss") {
                  badgeClass = "bg-red";
                }
                
                html += `
                  <div class="match-row">
                    <span>${p.match}</span>
                    <span class="badge ${badgeClass}">${p.prediction} | ${p.score}</span>
                  </div>
                `;
              });
            }
            document.getElementById("modalBody").innerHTML = html;
          } else {
            document.getElementById("modalBody").innerHTML = "Greška pri preuzimanju tiketa.";
          }
        })
        .catch(err => {
          document.getElementById("modalBody").innerHTML = "Greška u komunikaciji sa serverom.";
        });
    }

    function closeModal() {
      document.getElementById("modal").style.display = "none";
    }

    // Automatsko pokretanje pri učitavanju stranice
    window.onload = fetchRanking;
  </script>

</body>
</html>
