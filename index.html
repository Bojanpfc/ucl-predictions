<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UCL Predictions</title>
<!-- html2canvas biblioteka za konvertovanje tiketa u PNG sliku -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root {
  --bg-dark: #030814;
  --bg-card: rgba(13, 25, 48, 0.75);
  --bg-card-hover: rgba(18, 35, 66, 0.85);
  --border-line: rgba(77, 130, 224, 0.2);
  --border-glow: rgba(0, 240, 255, 0.4);
  --text-main: #f8fafc;
  --text-muted: #8ea3c7;
  --accent-blue: #0055ff;
  --accent-cyan: #00f0ff;
  --accent-gold: #f59e0b;
  --success: #10b981;
  --danger: #ef4444;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: radial-gradient(circle at 50% 0%, #0d224a 0%, #030814 65%);
  color: var(--text-main);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  min-height: 100vh;
  padding-bottom: 40px;
}

.wrap {
  max-width: 900px;
  margin: auto;
  padding: 20px 16px;
}

/* Header Section */
header {
  text-align: center;
  padding: 30px 10px 20px;
  position: relative;
}

.ucl-logo {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 54px;
  height: 54px;
  background: radial-gradient(circle, rgba(0,240,255,0.15) 0%, rgba(0,0,0,0) 70%);
  border: 1px solid var(--border-glow);
  border-radius: 50%;
  margin-bottom: 12px;
  box-shadow: 0 0 20px rgba(0,240,255,0.2);
  font-size: 24px;
}

.eyebrow {
  color: var(--accent-cyan);
  font-size: 11px;
  letter-spacing: 4px;
  font-weight: 800;
  text-transform: uppercase;
}

h1 {
  margin: 6px 0 8px;
  font-size: 32px;
  font-weight: 900;
  letter-spacing: 1.5px;
  background: linear-gradient(180deg, #ffffff 0%, #94a3b8 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.sub {
  color: var(--text-muted);
  font-size: 13px;
  font-weight: 500;
}

/* User Card */
.player {
  background: var(--bg-card);
  backdrop-filter: blur(12px);
  border: 1px solid var(--border-line);
  border-radius: 18px;
  padding: 18px 20px;
  margin: 15px 0 20px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
}

label {
  display: block;
  font-size: 11px;
  color: var(--accent-cyan);
  margin-bottom: 8px;
  font-weight: 800;
  letter-spacing: 1px;
}

input[type="text"] {
  width: 100%;
  background: rgba(5, 12, 28, 0.8);
  color: #fff;
  border: 1px solid var(--border-line);
  border-radius: 12px;
  padding: 14px 16px;
  font-size: 15px;
  outline: none;
  transition: all 0.25s ease;
}

input[type="text"]:focus {
  border-color: var(--accent-cyan);
  box-shadow: 0 0 12px rgba(0, 240, 255, 0.25);
}

/* Round Navigation */
.rounds {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  padding: 4px 2px 14px;
  scrollbar-width: none;
}

.rounds::-webkit-scrollbar { display: none; }

.rounds button {
  min-width: 95px;
  border: 1px solid var(--border-line);
  background: var(--bg-card);
  backdrop-filter: blur(8px);
  color: var(--text-muted);
  border-radius: 12px;
  padding: 11px 14px;
  font-weight: 700;
  font-size: 13px;
  cursor: pointer;
  transition: all 0.2s ease;
  white-space: nowrap;
}

.rounds button:hover:not(.locked) {
  border-color: var(--accent-cyan);
  color: #fff;
}

.rounds button.active {
  background: linear-gradient(135deg, var(--accent-blue), #003db3);
  color: #fff;
  border-color: var(--accent-cyan);
  box-shadow: 0 4px 15px rgba(0, 85, 255, 0.4);
}

.rounds button.locked {
  opacity: 0.4;
  cursor: not-allowed;
}

/* Info & Progress Bar */
.round-header-info {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 12px;
  padding: 0 4px;
}

.info {
  font-size: 13px;
  color: var(--text-muted);
  font-weight: 600;
}

.progress-container {
  background: rgba(255, 255, 255, 0.05);
  border-radius: 20px;
  padding: 4px 12px;
  border: 1px solid var(--border-line);
  font-size: 12px;
  color: var(--accent-cyan);
  font-weight: 700;
}

/* Match Cards */
.card {
  background: var(--bg-card);
  backdrop-filter: blur(12px);
  border: 1px solid var(--border-line);
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 12px;
  position: relative;
  transition: all 0.25s ease;
}

.card:hover {
  background: var(--bg-card-hover);
  border-color: rgba(0, 240, 255, 0.3);
  transform: translateY(-2px);
}

.card.completed {
  border-color: rgba(16, 185, 129, 0.4);
}

.match {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 12px;
  align-items: center;
}

.team {
  font-weight: 700;
  font-size: 15px;
  line-height: 1.3;
  display: flex;
  align-items: center;
  gap: 8px;
}

.team-crest {
  width: 24px;
  height: 24px;
  object-fit: contain;
  flex-shrink: 0;
}

.away { 
  justify-content: flex-end; 
  text-align: right; 
}

.vs {
  font-size: 11px;
  color: var(--accent-cyan);
  font-weight: 900;
  background: rgba(0, 240, 255, 0.1);
  padding: 4px 8px;
  border-radius: 6px;
}

/* Options Pick */
.options {
  display: flex;
  gap: 8px;
  margin-top: 14px;
}

.pick {
  flex: 1;
  padding: 10px;
  border-radius: 10px;
  border: 1px solid var(--border-line);
  background: rgba(5, 12, 28, 0.6);
  color: var(--text-muted);
  font-weight: 800;
  font-size: 14px;
  cursor: pointer;
  transition: all 0.2s ease;
}

.pick:hover {
  background: rgba(0, 85, 255, 0.2);
  color: #fff;
}

.pick.selected {
  background: linear-gradient(135deg, var(--accent-blue), #0033a0);
  color: white;
  border-color: var(--accent-cyan);
  box-shadow: 0 0 10px rgba(0, 85, 255, 0.5);
}

/* Score Row */
.score-row {
  margin-top: 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: rgba(5, 12, 28, 0.4);
  padding: 8px 12px;
  border-radius: 10px;
  border: 1px dashed rgba(255, 255, 255, 0.08);
}

.score-label {
  font-size: 11px;
  color: var(--text-muted);
  font-weight: 800;
  letter-spacing: 0.5px;
}

.score-boxes {
  display: flex;
  align-items: center;
  gap: 8px;
}

.score-input {
  width: 48px;
  height: 38px;
  background: rgba(5, 12, 28, 0.9);
  color: white;
  border: 1px solid var(--border-line);
  border-radius: 8px;
  text-align: center;
  font-size: 16px;
  font-weight: 800;
  outline: none;
  transition: all 0.2s ease;
}

.score-input:focus {
  border-color: var(--accent-cyan);
  box-shadow: 0 0 8px rgba(0, 240, 255, 0.3);
}

.score-colon {
  font-size: 16px;
  color: var(--accent-cyan);
  font-weight: 800;
}

/* Submit & Messages */
.submit {
  width: 100%;
  border: 0;
  border-radius: 14px;
  background: linear-gradient(90deg, #0055ff, #00c3ff);
  color: white;
  font-size: 16px;
  font-weight: 800;
  padding: 16px;
  margin: 15px 0 25px;
  cursor: pointer;
  box-shadow: 0 6px 20px rgba(0, 85, 255, 0.35);
  transition: all 0.25s ease;
  letter-spacing: 0.5px;
}

.submit:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: 0 8px 25px rgba(0, 195, 255, 0.5);
}

.submit:disabled {
  opacity: 0.6;
  cursor: not-allowed;
  box-shadow: none;
}

.msg {
  display: none;
  text-align: center;
  padding: 14px;
  border-radius: 12px;
  margin-bottom: 16px;
  font-size: 13px;
  font-weight: 700;
}

.msg.ok {
  display: block;
  background: rgba(16, 185, 129, 0.15);
  border: 1px solid var(--success);
  color: #6ee7b7;
}

.msg.err {
  display: block;
  background: rgba(239, 68, 68, 0.15);
  border: 1px solid var(--danger);
  color: #fca5a5;
}

.lockbox {
  text-align: center;
  padding: 35px 15px;
  color: var(--text-muted);
}

.lockicon {
  font-size: 36px;
  margin-bottom: 10px;
}

footer {
  text-align: center;
  color: var(--text-muted);
  font-size: 12px;
  padding: 10px 0 20px;
  border-top: 1px solid var(--border-line);
}

/* Modal Pop-up Styling */
.modal-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(2, 6, 18, 0.88);
  backdrop-filter: blur(8px);
  z-index: 1000;
  align-items: flex-start;
  justify-content: center;
  padding: 12px;
  overflow-y: auto;
}

.modal-content {
  background: #071126;
  border: 1px solid var(--border-glow);
  border-radius: 18px;
  max-width: 440px;
  width: 100%;
  padding: 14px;
  box-shadow: 0 0 35px rgba(0, 240, 255, 0.25);
  position: relative;
  margin: auto;
}

.close-modal {
  position: absolute;
  top: 10px;
  right: 14px;
  background: none;
  border: none;
  color: var(--text-muted);
  font-size: 24px;
  cursor: pointer;
  font-weight: bold;
}

.close-modal:hover { color: #fff; }

/* Dynamic Ticket Card Ultra Compact */
.ticket-card {
  background: #050c1e;
  border: 1.5px solid var(--accent-blue);
  border-radius: 12px;
  padding: 10px;
  color: #fff;
  margin-bottom: 12px;
  width: 100%;
}

.ticket-header {
  text-align: center;
  border-bottom: 1px dashed var(--border-line);
  padding-bottom: 6px;
  margin-bottom: 6px;
}

.ticket-header .ucl-badge {
  font-size: 8.5px;
  color: var(--accent-cyan);
  letter-spacing: 1.5px;
  font-weight: 800;
}

.ticket-header h3 {
  font-size: 15px;
  margin: 2px 0 4px;
  color: #fff;
}

.ticket-meta {
  display: flex;
  justify-content: center;
  gap: 10px;
  font-size: 11px;
  color: var(--text-muted);
  font-weight: 600;
}

.ticket-meta span {
  color: var(--accent-cyan);
  font-weight: 700;
}

.ticket-grid {
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.ticket-item {
  background: rgba(13, 25, 48, 0.85);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 5px;
  padding: 3px 6px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 6px;
}

.ticket-teams {
  font-weight: 600;
  font-size: 10px;
  color: #e2e8f0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  flex: 1;
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 4px;
}

.ticket-crest {
  width: 14px;
  height: 14px;
  object-fit: contain;
  flex-shrink: 0;
}

.ticket-badges {
  display: flex;
  gap: 3px;
  align-items: center;
  flex-shrink: 0;
}

.badge-pick {
  background: var(--accent-blue);
  color: #fff;
  font-weight: 800;
  padding: 1px 5px;
  border-radius: 3px;
  font-size: 9.5px;
}

.badge-score {
  background: rgba(0, 240, 255, 0.15);
  color: var(--accent-cyan);
  border: 1px solid var(--accent-cyan);
  font-weight: 800;
  padding: 1px 5px;
  border-radius: 3px;
  font-size: 9.5px;
}

.ticket-footer {
  margin-top: 6px;
  padding-top: 6px;
  border-top: 1px dashed var(--border-line);
  display: flex;
  justify-content: space-between;
  font-size: 8.5px;
  color: var(--text-muted);
}

.modal-actions {
  display: flex;
  gap: 8px;
}

.btn-download {
  flex: 1;
  background: linear-gradient(135deg, #10b981, #059669);
  color: white;
  border: none;
  border-radius: 10px;
  padding: 10px;
  font-weight: 800;
  cursor: pointer;
  font-size: 12.5px;
  transition: all 0.2s ease;
}

.btn-download:hover { opacity: 0.9; }

.btn-close-sec {
  background: rgba(255, 255, 255, 0.1);
  color: #fff;
  border: none;
  border-radius: 10px;
  padding: 10px 14px;
  font-weight: 700;
  cursor: pointer;
  font-size: 12.5px;
}

@media(max-width: 560px) {
  h1 { font-size: 24px; }
  .team { font-size: 13px; }
  .match { gap: 6px; }
  .score-row { flex-direction: column; gap: 8px; align-items: flex-start; }
  .score-boxes { width: 100%; justify-content: space-between; }
  .score-input { width: 45%; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="ucl-logo">⚽</div>
    <div class="eyebrow">✦ UEFA CHAMPIONS LEAGUE ✦</div>
    <h1>UCL PREDICTIONS</h1>
    <div class="sub">Predict match outcomes and exact scores • 1 / X / 2</div>
  </header>

  <div class="player">
    <label for="player">YOUR DISCORD NAME</label>
    <input id="player" type="text" maxlength="50" placeholder="e.g. User#1234 or Username">
  </div>

  <div class="rounds" id="roundNav"></div>
  
  <div class="round-header-info">
    <div class="info" id="roundInfo"></div>
    <div class="progress-container" id="progressInfo">0 / 0 Completed</div>
  </div>

  <div id="message" class="msg"></div>
  <div id="matches"></div>
  
  <button class="submit" id="submitBtn" onclick="submitPredictions()">SUBMIT ROUND PREDICTIONS</button>

  <footer>
    Outcome hit = 1 point • Exact score = 3 points total • Predictions lock after submission.
  </footer>
</div>

<!-- POP-UP MODAL TIKET -->
<div id="ticketModal" class="modal-overlay">
  <div class="modal-content">
    <button class="close-modal" onclick="closeModal()">&times;</button>
    
    <!-- Element koji se snima u PNG -->
    <div id="ticketToCapture" class="ticket-card">
      <div class="ticket-header">
        <div class="ucl-badge">✦ OFFICIAL PREDICTION TICKET ✦</div>
        <h3>UEFA CHAMPIONS LEAGUE</h3>
        <div class="ticket-meta">
          <div>User: <span id="modalUser"></span></div>
          <div>Round: <span id="modalRound"></span></div>
        </div>
      </div>
      
      <div class="ticket-grid" id="modalMatches"></div>

      <div class="ticket-footer">
        <div>Date: <span id="modalDate"></span></div>
        <div>Verified Submission ✔</div>
      </div>
    </div>

    <div class="modal-actions">
      <button class="btn-download" onclick="downloadTicketPNG()">📥 Download Ticket (PNG)</button>
      <button class="btn-close-sec" onclick="closeModal()">Close</button>
    </div>
  </div>
</div>

<script>
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxt1iXHzb3F4oL1M0eHHal-Oc7MiQgkrFHTOfnkYlMabacE7Fjf9akFZyQ4n056BMr1/exec";

/* Mapa grbova klubova sa direktnim transparentnim PNG slika */
const teamLogos = {
  "AEK Athens": "https://upload.wikimedia.org/wikipedia/en/0/04/AEK_Athens_FC_logo.svg",
  "LASK": "https://upload.wikimedia.org/wikipedia/en/8/8b/LASK_Linz_logo.svg",
  "Club Brugge": "https://upload.wikimedia.org/wikipedia/en/d/d0/Club_Brugge_KV_logo.svg",
  "Aston Villa": "https://upload.wikimedia.org/wikipedia/en/9/9f/Aston_Villa_logo.svg",
  "Borussia Dortmund": "https://upload.wikimedia.org/wikipedia/commons/6/67/Borussia_Dortmund_logo.svg",
  "Villarreal": "https://upload.wikimedia.org/wikipedia/en/7/70/Villarreal_CF_logo.svg",
  "Porto": "https://upload.wikimedia.org/wikipedia/en/f/f1/FC_Porto.svg",
  "Manchester City": "https://upload.wikimedia.org/wikipedia/en/e/eb/Manchester_City_FC_badge.svg",
  "Lille": "https://upload.wikimedia.org/wikipedia/en/6/6f/LOSC_Lille_logo.svg",
  "Real Betis": "https://upload.wikimedia.org/wikipedia/en/1/13/Real_betis_logo.svg",
  "Real Madrid": "https://upload.wikimedia.org/wikipedia/en/5/56/Real_Madrid_CF.svg",
  "Inter": "https://upload.wikimedia.org/wikipedia/commons/0/05/FC_Internazionale_Milano_2021.svg",
  "Barcelona": "https://upload.wikimedia.org/wikipedia/en/4/47/FC_Barcelona_%28crest%29.svg",
  "Feyenoord": "https://upload.wikimedia.org/wikipedia/commons/e/e3/Feyenoord_logo_2024.svg",
  "Stuttgart": "https://upload.wikimedia.org/wikipedia/commons/e/eb/VfB_Stuttgart_1893_Logo.svg",
  "Viking": "https://upload.wikimedia.org/wikipedia/en/9/96/Viking_FK_logo.svg",
  "Liverpool": "https://upload.wikimedia.org/wikipedia/en/0/0c/Liverpool_FC.svg",
  "Atlético de Madrid": "https://upload.wikimedia.org/wikipedia/en/c/c1/Atletico_Madrid_logo.svg",
  "Paris Saint-Germain": "https://upload.wikimedia.org/wikipedia/en/a/a7/Paris_Saint-Germain_F.C..svg",
  "Slovan Bratislava": "https://upload.wikimedia.org/wikipedia/commons/2/23/ŠK_Slovan_Bratislava_logo.svg",
  "Sporting CP": "https://upload.wikimedia.org/wikipedia/en/e/e1/Sporting_Clube_de_Portugal_%28logo%29.svg",
  "Galatasaray": "https://upload.wikimedia.org/wikipedia/commons/3/37/Galatasaray_Star_Logo.svg",
  "Napoli": "https://upload.wikimedia.org/wikipedia/commons/2/28/SSC_Napoli_2024_%28deep_blue%29.svg",
  "Arsenal": "https://upload.wikimedia.org/wikipedia/en/5/53/Arsenal_FC.svg",
  "Fenerbahçe": "https://upload.wikimedia.org/wikipedia/en/3/39/Fenerbah%C3%A7e.svg",
  "Roma": "https://upload.wikimedia.org/wikipedia/en/f/f7/AS_Roma_logo_%282017%29.svg",
  "PSV Eindhoven": "https://upload.wikimedia.org/wikipedia/en/0/05/PSV_Eindhoven.svg",
  "Shakhtar Donetsk": "https://upload.wikimedia.org/wikipedia/en/a/a1/FC_Shakhtar_Donetsk.svg",
  "Como": "https://upload.wikimedia.org/wikipedia/en/8/87/Como_1907_logo.svg",
  "Leipzig": "https://upload.wikimedia.org/wikipedia/en/0/04/RB_Leipzig_2014_logo.svg",
  "Bayern München": "https://upload.wikimedia.org/wikipedia/commons/1/1b/FC_Bayern_München_logo_%282017%29.svg",
  "Bodø/Glimt": "https://upload.wikimedia.org/wikipedia/en/b/b3/FK_Bod%C3%B8-Glimt_logo.svg",
  "Manchester United": "https://upload.wikimedia.org/wikipedia/en/7/7a/Manchester_United_FC_crest.svg",
  "Sabah": "https://upload.wikimedia.org/wikipedia/en/f/f5/Sabah_FC_logo.svg",
  "Slavia Praha": "https://upload.wikimedia.org/wikipedia/en/d/d4/SK_Slavia_Prague_logo.svg",
  "Lens": "https://upload.wikimedia.org/wikipedia/en/3/3c/RC_Lens_logo.svg"
};

const DEFAULT_LOGO = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2300f0ff'%3E%3Cpath d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z'/%3E%3C/svg%3E";

function getCrestHtml(teamName, isTicket = false) {
  const url = teamLogos[teamName] || DEFAULT_LOGO;
  const cls = isTicket ? "ticket-crest" : "team-crest";
  return `<img class="${cls}" src="${url}" alt="${esc(teamName)}" crossorigin="anonymous" onerror="this.onerror=null;this.src='${DEFAULT_LOGO}';">`;
}

const roundDates = {"1":"8–10 September 2026","2":"13–14 October 2026","3":"20–21 October 2026","4":"3–4 November 2026","5":"24–25 November 2026","6":"8–9 December 2026","7":"19–20 January 2027","8":"27 January 2027"};
const roundUnlockDates = {"1":"2026-09-06T18:45:00+02:00","2":"2026-10-11T18:45:00+02:00","3":"2026-10-18T18:45:00+02:00","4":"2026-11-01T18:45:00+01:00","5":"2026-11-22T18:45:00+01:00","6":"2026-12-06T18:45:00+01:00","7":"2027-01-17T18:45:00+01:00","8":"2027-01-25T21:00:00+01:00"};

let currentRound = 1;
const selections = {};

function esc(s) {
  return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
}

function isOpen(round) {
  return Date.now() >= new Date(roundUnlockDates[round]).getTime();
}

function checkServerDuplicate(player, round) {
  return new Promise(function(resolve) {
    const callback = 'uclDuplicateCheck_' + Date.now() + '_' + Math.floor(Math.random() * 100000);
    const script = document.createElement('script');
    let finished = false;

    function cleanup() {
      if (script.parentNode) script.parentNode.removeChild(script);
      try { delete window[callback]; } catch(e) {}
    }

    function finish(value) {
      if (finished) return;
      finished = true;
      cleanup();
      resolve(!!value);
    }

    window[callback] = function(data) { finish(data && data.duplicate === true); };
    script.src = APPS_SCRIPT_URL + '?player=' + encodeURIComponent(player) + '&round=' + encodeURIComponent('Round ' + round) + '&callback=' + encodeURIComponent(callback);
    script.onerror = function() { finish(false); };
    document.body.appendChild(script);
    setTimeout(function() { finish(false); }, 8000);
  });
}

function renderNav() {
  const nav=document.getElementById('roundNav');
  nav.innerHTML='';
  for(let r=1;r<=8;r++) {
    const b=document.createElement('button');
    b.className=(r===currentRound?'active ':'')+(isOpen(r)?'':'locked');
    b.textContent='ROUND '+r+(isOpen(r)?'':' 🔒');
    b.onclick=()=>{currentRound=r;render();};
    nav.appendChild(b);
  }
}

function updateProgress() {
  if(!isOpen(currentRound)) {
    document.getElementById('progressInfo').style.display = 'none';
    return;
  }
  document.getElementById('progressInfo').style.display = 'block';
  const total = rounds[currentRound].length;
  let done = 0;
  for(let i=0; i<total; i++) {
    const p = selections[currentRound+'_'+i];
    const score = scoreFor(i);
    if(p && validScore(score)) done++;
  }
  document.getElementById('progressInfo').textContent = `${done} / ${total} Filled`;
}

function render() {
  renderNav();
  const open=isOpen(currentRound);
  const info=document.getElementById('roundInfo');
  info.textContent='Round '+currentRound+' • '+roundDates[currentRound]+' • '+(open?'OPEN':'LOCKED');
  const box=document.getElementById('matches');
  box.innerHTML='';
  const btn=document.getElementById('submitBtn');

  updateProgress();

  if(!open) {
    box.innerHTML='<div class="card lockbox"><div class="lockicon">🔒</div><b>Round '+currentRound+' is locked</b><br><br>It will open automatically 2 days before the round starts.</div>';
    btn.disabled=true; return;
  }
  btn.disabled=false;

  rounds[currentRound].forEach((m,i)=> {
    const key=currentRound+'_'+i;
    const selected=selections[key]||'';
    const score = scoreFor(i);
    const isCompleted = selected && validScore(score);

    const card=document.createElement('div');
    card.className='card' + (isCompleted ? ' completed' : '');
    card.innerHTML=`
    <div class="match">
      <div class="team">${getCrestHtml(m[0])} <span>${esc(m[0])}</span></div>
      <div class="vs">VS</div>
      <div class="team away"><span>${esc(m[1])}</span> ${getCrestHtml(m[1])}</div>
    </div>
    <div class="options">
      <button class="pick ${selected==='1'?'selected':''}" onclick="pick(${i},'1')">1</button>
      <button class="pick ${selected==='X'?'selected':''}" onclick="pick(${i},'X')">X</button>
      <button class="pick ${selected==='2'?'selected':''}" onclick="pick(${i},'2')">2</button>
    </div>
    <div class="score-row">
      <span class="score-label">EXACT SCORE</span>
      <div class="score-boxes">
        <input class="score-input" id="home-score-${i}" inputmode="numeric" maxlength="2"
               placeholder="0" value="${scoreParts(i)[0]}"
               oninput="setScorePart(${i},'home',this.value)">
        <span class="score-colon">:</span>
        <input class="score-input" id="away-score-${i}" inputmode="numeric" maxlength="2"
               placeholder="0" value="${scoreParts(i)[1]}"
               oninput="setScorePart(${i},'away',this.value)">
      </div>
    </div>`;
    box.appendChild(card);
  });
}

function pick(i,value) {
  selections[currentRound+'_'+i]=value;
  render();
}

function scoreFor(i) {
  return selections[currentRound+'_score_'+i] || '';
}

function scoreParts(i) {
  const value=scoreFor(i).replace('-',':');
  const parts=value.split(':');
  return [parts[0]||'', parts[1]||''];
}

function setScorePart(i,side,value) {
  value=String(value||'').replace(/\D/g,'').slice(0,2);
  const parts=scoreParts(i);
  if(side==='home') parts[0]=value;
  else parts[1]=value;
  selections[currentRound+'_score_'+i]=parts[0]+':'+parts[1];
  
  const key = currentRound+'_'+i;
  const card = document.querySelectorAll('.card')[i];
  if(card) {
    if(selections[key] && validScore(parts[0]+':'+parts[1])) {
      card.classList.add('completed');
    } else {
      card.classList.remove('completed');
    }
  }
  updateProgress();
}

function validScore(value) {
  return /^\d{1,2}:\d{1,2}$/.test(value);
}

function showMsg(text,type) {
  const m=document.getElementById('message'); m.className='msg '+type; m.textContent=text;
  window.scrollTo({top:0,behavior:'smooth'});
}

/* Modal Ticket Functions */
function openTicketModal(player, roundNum, predictions) {
  document.getElementById('modalUser').textContent = player;
  document.getElementById('modalRound').textContent = 'Round ' + roundNum;
  
  const now = new Date();
  document.getElementById('modalDate').textContent = now.toLocaleDateString() + ' ' + now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

  const container = document.getElementById('modalMatches');
  container.innerHTML = '';

  predictions.forEach((p, idx) => {
    const pair = rounds[roundNum][idx];
    const item = document.createElement('div');
    item.className = 'ticket-item';
    item.innerHTML = `
      <div class="ticket-teams" title="${esc(p.match)}">
        ${getCrestHtml(pair[0], true)} ${esc(pair[0])} vs ${esc(pair[1])} ${getCrestHtml(pair[1], true)}
      </div>
      <div class="ticket-badges">
        <span class="badge-pick">${esc(p.prediction)}</span>
        <span class="badge-score">${esc(p.score)}</span>
      </div>
    `;
    container.appendChild(item);
  });

  document.getElementById('ticketModal').style.display = 'flex';
}

function closeModal() {
  document.getElementById('ticketModal').style.display = 'none';
}

function downloadTicketPNG() {
  const ticketElement = document.getElementById('ticketToCapture');

  html2canvas(ticketElement, {
    backgroundColor: '#050c1e',
    scale: 2,
    useCORS: true,
    allowTaint: false,
    windowHeight: ticketElement.scrollHeight
  }).then(canvas => {
    const link = document.createElement('a');
    const player = document.getElementById('modalUser').textContent || 'User';
    link.download = `UCL_Ticket_Round_${currentRound}_${player}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
  });
}

async function submitPredictions() {
  const player=(document.getElementById('player').value||'').trim();
  if(!player) return showMsg('Please enter your Discord name.','err');
  if(!isOpen(currentRound)) return showMsg('This round is still locked.','err');
  const duplicate = await checkServerDuplicate(player, currentRound);
  if(duplicate) return showMsg('You have already submitted this round.','err');

  const preds=[];
  for(let i=0;i<rounds[currentRound].length;i++) {
    const p=selections[currentRound+'_'+i];
    const score=scoreFor(i).replace('-',':');
    if(!p) return showMsg('Please predict every match before submitting.','err');
    if(!validScore(score)) return showMsg('Please enter a valid exact score for every match, e.g. 0:0.','err');
    preds.push({match: rounds[currentRound][i][0]+' vs '+rounds[currentRound][i][1], prediction:p, score:score});
  }

  const btn=document.getElementById('submitBtn');
  btn.disabled=true; 
  btn.textContent='SENDING...';

  const payload={player:player,round:'Round '+currentRound,predictions:preds};
  try {
    await fetch(APPS_SCRIPT_URL,{
      method:'POST',
      mode:'no-cors',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify(payload)
    });
    showMsg('Predictions submitted successfully!','ok');
    
    btn.textContent='SUBMITTED ✔';
    
    openTicketModal(player, currentRound, preds);
    
    render();
  } catch(err) {
    btn.disabled=false; 
    btn.textContent='SUBMIT ROUND PREDICTIONS';
    showMsg('Submission failed. Please try again.','err');
  }
}

document.getElementById('player').addEventListener('input',()=>render());
render();
</script>
