<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prediction League</title>
  
  <!-- OVDJE ZADRŽAVAŠ SVE TVOJE POSTOJEĆE STILOVE / CSS -->
  <style>
    /* TVOJI STARI CSS STILOVI IDU OVDE */

    /* DODATAK ZA DUGMAD I TABOVE: */
    .nav-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      justify-content: center;
    }

    .tab-btn {
      padding: 10px 20px;
      background-color: #1a2332;
      color: #8b949e;
      border: 1px solid #2a3b53;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .tab-btn.active {
      background-color: #00f0ff;
      color: #0d1117;
      border-color: #00f0ff;
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Stil za Rang Listu */
    .loader { text-align: center; padding: 20px; color: #00f0ff; }
    .ranking-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    .ranking-table th { background: #1a2332; color: #00f0ff; padding: 10px; border-bottom: 2px solid #2a3b53; }
    .ranking-table td { padding: 10px; border-bottom: 1px solid #1e2d42; text-align: center; }
    .player-name { text-align: left; font-weight: bold; color: #fff; }
    .rank-1 { background: rgba(255, 215, 0, 0.1); }
    .rank-2 { background: rgba(192, 192, 192, 0.1); }
    .rank-3 { background: rgba(205, 127, 50, 0.1); }
  </style>
</head>
<body>

  <!-- DUGMAD ZA PREBACIVANJE -->
  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('predictions-tab', this)">Predikcije</button>
    <button class="tab-btn" onclick="switchTab('ranking-tab', this)">Rang Lista</button>
  </div>

  <!-- TAB 1: PREDIKCIJE (TVOJ STARI HTML) -->
  <div id="predictions-tab" class="tab-content active">
    
    <!-- ======================================================== -->
    <!--  OVDE VRATI / NALEPI CEO TVOJ STARI HTML KOD ZA FORMU   -->
    <!-- ======================================================== -->

  </div>

  <!-- TAB 2: RANG LISTA -->
  <div id="ranking-tab" class="tab-content">
    <h2 style="text-align: center; color: #fff; margin-bottom: 15px;">Leaderboard</h2>
    <div id="ranking-loader" class="loader">Učitavanje rang liste...</div>
    
    <table id="ranking-table" class="ranking-table" style="display: none;">
      <thead>
        <tr>
          <th>#</th>
          <th style="text-align: left;">Player</th>
          <th>PTS</th>
          <th>Exact (3p)</th>
          <th>Outcome (1p)</th>
          <th>Played</th>
        </tr>
      </thead>
      <tbody id="ranking-body"></tbody>
    </table>
  </div>

  <!-- TVOJE STARE SKRIPTE ZA SLANJE PREDIKCIJA IDU OVDE -->
  <script>
    // TVOJ STARI JAVASCRIPT KOD ZA SLANJE PREDIKCIJA
  </script>

  <!-- LOGIKA ZA RANG LISTU -->
  <script>
    const WEB_APP_URL = 'https://script.google.com/macros/s/TVOJ_SCRIPT_ID/exec'; // Zamenjaj sa tvojim URL-om

    function switchTab(tabId, btn) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

      document.getElementById(tabId).classList.add('active');
      btn.classList.add('active');

      if (tabId === 'ranking-tab') {
        loadRanking();
      }
    }

    function loadRanking() {
      const loader = document.getElementById('ranking-loader');
      const table = document.getElementById('ranking-table');
      const tbody = document.getElementById('ranking-body');

      loader.style.display = 'block';
      table.style.display = 'none';

      fetch(`${WEB_APP_URL}?action=ranking`)
        .then(res => res.json())
        .then(data => {
          if (data.success && data.ranking) {
            tbody.innerHTML = '';
            data.ranking.forEach(row => {
              const tr = document.createElement('tr');
              if (row.rank === 1) tr.classList.add('rank-1');
              if (row.rank === 2) tr.classList.add('rank-2');
              if (row.rank === 3) tr.classList.add('rank-3');

              tr.innerHTML = `
                <td><strong>${row.rank}</strong></td>
                <td class="player-name">${row.player}</td>
                <td style="color:#00f0ff; font-weight:bold;">${row.points}</td>
                <td>${row.exactScores}</td>
                <td>${row.correctOutcomes}</td>
                <td>${row.matchesPlayed}</td>
              `;
              tbody.appendChild(tr);
            });
            loader.style.display = 'none';
            table.style.display = 'table';
          }
        })
        .catch(err => {
          loader.innerText = 'Greška pri učitavanju tabele.';
          console.error(err);
        });
    }
  </script>
</body>
</html>
