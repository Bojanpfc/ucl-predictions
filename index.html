<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UCL Predictions</title>
    <style>
        body {
            background-color: #0b1329;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 500px;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header h1 {
            font-size: 24px;
            letter-spacing: 2px;
            margin: 5px 0;
        }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .tab-btn {
            flex: 1;
            padding: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }
        .tab-btn.active {
            background: #0052cc;
            border-color: #0052cc;
        }
        .section {
            display: none;
        }
        .section.active {
            display: block;
        }

        /* Moderan dizajn Leaderboard tabele */
        .leaderboard-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 8px;
            margin-top: 10px;
        }
        .leaderboard-table th {
            color: #8b9bb4;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 8px 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            text-align: left;
        }
        .leaderboard-table th:first-child, 
        .leaderboard-table td:first-child {
            text-align: center;
            width: 35px;
        }
        .leaderboard-table td {
            padding: 12px 10px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(5px);
            font-size: 14px;
        }
        .leaderboard-table tr td:first-child {
            border-top-left-radius: 8px;
            border-bottom-left-radius: 8px;
        }
        .leaderboard-table tr td:last-child {
            border-top-right-radius: 8px;
            border-bottom-right-radius: 8px;
        }
        /* Zlatni sjaj za prvoplasiranog */
        .leaderboard-table tr:nth-child(1) td {
            background: linear-gradient(90deg, rgba(255, 215, 0, 0.18), rgba(255, 255, 255, 0.05));
            border: 1px solid rgba(255, 215, 0, 0.35);
            font-weight: bold;
        }
        .leaderboard-table tr:hover td {
            background: rgba(255, 255, 255, 0.08);
        }

        .info-footer {
            text-align: center;
            font-size: 12px;
            color: #8b9bb4;
            margin-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <p style="font-size: 11px; letter-spacing: 1px; color: #8b9bb4;">✨ UEFA CHAMPIONS LEAGUE ✨</p>
            <h1>UCL PREDICTIONS</h1>
            <p style="font-size: 12px; color: #8b9bb4;">Predict match outcomes and exact scores • 1 / X / 2</p>
        </div>

        <div class="tabs">
            <button class="tab-btn" onclick="switchTab('predictions')">PREDICTIONS</button>
            <button class="tab-btn active" onclick="switchTab('leaderboard')">LEADERBOARD</button>
        </div>

        <!-- Predictions Section -->
        <div id="predictions-section" class="section">
            <!-- Tvoja forma za prognoze stoji ovde -->
        </div>

        <!-- Leaderboard Section -->
        <div id="leaderboard-section" class="section active">
            <div id="leaderboard-content">
                <table class="leaderboard-table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>PLAYER</th>
                            <th>PTS</th>
                            <th>EXACT</th>
                            <th>OUTCOME</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboard-body">
                        <tr><td colspan="5" style="text-align: center; color: #8b9bb4;">Loading rankings...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="info-footer">
            Outcome hit = 1 point • Exact score = 3 points total • Predictions lock after submission.
        </div>
    </div>

    <script>
        // Zameni sa svojim pravim Apps Script Web App URL-om (onaj koji se završava sa /exec)
        const APPS_SCRIPT_URL = "OVDE_STAVI_SVOJ_APPS_SCRIPT_URL_OD_EXEC";

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            
            if (tab === 'predictions') {
                document.querySelector('.tabs button:nth-child(1)').classList.add('active');
                document.getElementById('predictions-section').classList.add('active');
            } else {
                document.querySelector('.tabs button:nth-child(2)').classList.add('active');
                document.getElementById('leaderboard-section').classList.add('active');
                loadLeaderboard();
            }
        }

        function loadLeaderboard() {
            const tbody = document.getElementById('leaderboard-body');
            tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: #8b9bb4;">Loading rankings...</td></tr>`;

            fetch(APPS_SCRIPT_URL + "?action=ranking")
                .then(response => response.json())
                .then(data => {
                    if (data.success && data.ranking.length > 0) {
                        let html = '';
                        data.ranking.forEach((row, index) => {
                            html += `
                                <tr>
                                    <td>${row.rank || (index + 1)}</td>
                                    <td>${row.player}</td>
                                    <td style="color: #4da6ff; font-weight: bold;">${row.points}</td>
                                    <td>${row.exactScores}</td>
                                    <td>${row.correctOutcomes}</td>
                                </tr>
                            `;
                        });
                        tbody.innerHTML = html;
                    } else {
                        tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: #ff4d4d;">Failed to load leaderboard.</td></tr>`;
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: #ff4d4d;">Failed to load leaderboard.</td></tr>`;
                });
        }

        // Automatsko učitavanje pri otvaranju stranice
        window.onload = function() {
            loadLeaderboard();
        };
    </script>
</body>
</html>
